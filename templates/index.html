<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Scanner Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .search-box { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-download { background-color: #28a745; padding: 5px 10px; text-decoration: none; color: white; border-radius: 4px; font-size: 14px; }
        .btn-download:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 GitHub File Scanner</h1>
        <p>গিটহাব থেকে স্ক্যান করা ফাইলগুলো এখানে জমা আছে।</p>

        <form method="GET" action="/" class="search-box">
            <input type="text" name="search" placeholder="ফাইলের নাম লিখে সার্চ করুন..." value="{{ search }}">
            <button type="submit">Search</button>
        </form>

        <h3>Files ({{ files|length }})</h3>
        <ul>
            {% for file in files %}
                <li>
                    <span>{{ file }}</span>
                    <a href="{{ url_for('download_file', filename=file) }}" class="btn-download">Download</a>
                </li>
            {% else %}
                <li>কোনো ফাইল পাওয়া যায়নি।</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
